# ---------------------------------------------------------------------------
# 9 teachers (paper MOPD): 3 families × 3 efforts
# Fine domains map into teacher_family; router picks matrix cell then domain_routings
# ---------------------------------------------------------------------------
teacher_family_map:
  general: general
  research: general
  agentic: agentic
  design: agentic
  coding: coding
  security: coding
  infra: coding
  trading: coding

teacher_matrix:
  general:
    low: [docs-writer, researcher]
    high: [researcher, docs-writer, canvas]
    max: [deep-researcher, researcher, dossier-investigator, memory-specialist]
  agentic:
    low: [workflow-specialist]
    high: [k3-cognitive-router-agent, goal-planner, workflow-specialist, browser-agent]
    max: [k3-cognitive-router-agent, coordinator, goal-planner, horizon-tracker, browser-agent]
  coding:
    low: [coder, git-specialist]
    high: [coder, tester, reviewer, architect]
    max: [coder, tester, reviewer, security-auditor, safety-specialist]

# ---------------------------------------------------------------------------
# Domain → preferred Top-k agent sets (augment teacher_matrix)
# ---------------------------------------------------------------------------
domain_routings:
  coding:
    preferred:
      - coder
      - tester
      - reviewer
      - architect
      - git-specialist
    workflows:
      - sparc-orchestrator  # when effort >= high and task is a feature
  agentic:
    preferred:
      - k3-cognitive-router-agent
      - coordinator
      - goal-planner
      - workflow-specialist
      - browser-agent
  security:
    preferred:
      - security-auditor
      - safety-specialist
      - owasp-security
      - security-audit
      - 09-web-security
      - review-security
  research:
    preferred:
      - deep-researcher
      - researcher
      - dossier-investigator
      - memory-specialist
  design:
    preferred:
      - webkit-frontend-design
      - webkit-shadcn-ui
      - browser-agent
  infra:
    preferred:
      - deployment-expert
      - performance-optimizer
      - migration-engineer
      - observability-engineer
  trading:
    preferred:
      - trading-strategist
      - market-analyst
      - risk-analyst
      - backtest-engineer
  general:
    preferred:
      - docs-writer
      - researcher
      - canvas

