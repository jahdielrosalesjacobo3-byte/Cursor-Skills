# SecureSkills Expert Registry — K3 LatentMoE-inspired catalog
# Canonical inventory for Cursor / Claude / Codex agent routing.
# activation: core = always eligible; on-demand = activate only when routed
# shared: true = always-on (like K3 shared experts)

version: 2
updated: "2026-07-29"
source_of_truth: SecureSkills
polish: "tech-report P1-P5: RAOVA, GRM, teacher_matrix, partial-rollout, harness-profiles"

domains:
  - general
  - agentic
  - coding
  - security
  - design
  - infra
  - trading
  - research

effort_levels:
  - low
  - high
  - max

routing_defaults:
  max_active_experts: 16
  typical_active_experts: 5
  full_spectrum_max_experts: 16
  topical_locks: false
  shared_experts:
    - security-scanning
    - semgrep-hooks
  shared_experts_role: advisory_on_code_only
  quantile_balancing: true
  deprecated_openrouter_kimi_byok: true
  snyk_code: disabled
  posture: full-spectrum-capable

# ---------------------------------------------------------------------------
# Shared experts (always on)
# ---------------------------------------------------------------------------
experts:
  - id: security-scanning
    domain: security
    runtime: cursor-rule
    path: cursor/rules/security-scanning.mdc
    activation: core
    shared: true
    effort_default: low
    triggers: ["code change", "dependency", "IaC", "container", "mcp config"]

  - id: semgrep-hooks
    domain: security
    runtime: cursor-hook
    path: cursor/hooks.json
    activation: core
    shared: true
    effort_default: low
    triggers: ["sessionStart", "afterFileEdit", "postToolUse", "stop"]

  - id: k3-cognitive-router
    domain: agentic
    runtime: cursor-skill
    path: cursor/user-skills/k3-cognitive-router
    activation: core
    shared: false
    effort_default: high
    triggers: ["complex task", "multi-agent", "long-horizon", "orchestrate"]
    aliases: ["k3-router", "cognitive-router"]

  - id: k3-cognitive-router-agent
    domain: agentic
    runtime: cursor-agent
    path: cursor/agents/k3-cognitive-router.md
    activation: core
    shared: false
    effort_default: high
    triggers: ["Task k3-cognitive-router", "explicit orchestration"]

