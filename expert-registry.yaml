# ---------------------------------------------------------------------------
# MCP routing — intent → namespace (servers live in cursor/mcp.json; L1 core.yaml
# is regenerated from ~/.cursor/mcp.json). Discover schemas with GetDynamicTools
# before calling. One MCP call = one Act step (fast-path friendly).
# ---------------------------------------------------------------------------
mcp_routing:
  repo_structure_graph:      { namespace: graphify,     tools: [query_graph, get_neighbors, shortest_path, viewer_url] }
  live_symbols_refactor:     { namespace: serena,       tools: [find_symbol, find_referencing_symbols, replace_symbol_body, rename_symbol, get_diagnostics_for_file] }
  library_docs_api:          { namespace: context7,     tools: [resolve-library-id, query-docs], auth: oauth }
  sast_single_file:          { namespace: Semgrep,      tools: [semgrep_scan, semgrep_scan_with_custom_rule] }
  sca_iac_container:         { namespace: Snyk,         tools: [snyk_sca_scan, snyk_iac_scan, snyk_container_scan, snyk_package_health_check] }
  github_prs_issues_actions: { namespace: github,       toolsets: [repos, issues, pull_requests, actions, code_security, dependabot, secret_protection, security_advisories], auth: "${env:GITHUB_TOKEN} (gh auth login → export)" }
  project_tracking:          { namespace: linear,       auth: oauth }
  aws_docs_regions:          { namespace: aws-knowledge, tools: [search_documentation, read_documentation], auth: none }
  ui_components:             { namespace: shadcn,       tools: [search_items_in_registries, get_add_command_for_items, get_audit_checklist] }
  agent_memory_swarm:        { namespace: claude-flow,  tools: [memory_store, memory_search, memory_retrieve, session_*, agent_*, swarm_*, hooks_*], notes: "ruflo v3; 49 SecureSkills agents reference mcp__claude-flow__*" }
  deploy_logs:               { namespace: Vercel }
  db_auth:                   { namespace: Supabase }
  design_refs:               { namespace: [Figma, Mobbin] }
  optional_not_installed:    { see: integrations/optional-mcp.md, servers: [sentry, terraform, firecrawl, exa, playwright, aws-api] }

