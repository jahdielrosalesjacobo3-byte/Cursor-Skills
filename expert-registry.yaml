# SecureSkills Expert Registry — K3 LatentMoE-inspired catalog
# Canonical inventory for Cursor / Claude / Codex agent routing.
# activation: core = always eligible; on-demand = activate only when routed
# shared: true = always-on (like K3 shared experts)

version: 4
updated: "2026-09-02"
source_of_truth: SecureSkills
polish: "tech-report P1-P5: RAOVA, GRM, teacher_matrix, partial-rollout, harness-profiles; v4: MCP routing (serena/context7/github/linear/aws/shadcn/claude-flow), Trail of Bits plugin, scoped rules, gitleaks guard"

# ---------------------------------------------------------------------------
# Two-level catalog (L1 core here, L2 on-demand index)
# ---------------------------------------------------------------------------
# This file is L1: the curated experts the router always considers. Everything
# else — thousands of marketplace plugin skills — lives in the L2 index and is
# searched only when L1 has no match. Regenerate L2 with
# scripts/build-integrations-catalog.sh; verify with scripts/verify-integrations.sh.
catalog_l2: integrations/catalog.json
catalog_core: integrations/core.yaml

lookup_policy:
  order: [l1_registry, l1_core_yaml, l2_catalog]
  l2_when: "no L1 expert covers the task, or the user names a skill/marketplace explicitly"
  l2_search_fields: [slug, name, description, k3_domain, marketplace]
  l2_activation: "read the single matching SKILL.md; activated L2 skills count against Top-k"
  l2_never: "do not load a whole shard or the full catalog into context"
  l2_max_per_task: 4
  counts_against_top_k: true

domains:
  - general
  - agentic
  - coding
  - security
  - design
  - infra
  - trading
  - research

effort_levels:
  - low
  - high
  - max

routing_defaults:
  max_active_experts: 16
  typical_active_experts: 3
  full_spectrum_max_experts: 16
  default_effort: low
  fast_path:
    default: true
    top_k_max: 2
    skip_unless_escalated: [task_subagents, orchestrator_state, grm, l2_catalog_grep]
    escalate_when:
      - user asks for depth, audit, orchestration, or full-spectrum
      - multi-step feature spanning many files plus tests
      - explicit effort max or harness full-spectrum
  topical_locks: false
  shared_experts:
    - security-scanning
    - semgrep-hooks
  shared_experts_role: advisory_on_code_only
  quantile_balancing: true
  deprecated_openrouter_kimi_byok: true
  snyk_code: disabled
  posture: full-spectrum-capable

# ---------------------------------------------------------------------------
# Shared experts (always on)
# ---------------------------------------------------------------------------
experts:
  - id: security-scanning
    domain: security
    runtime: cursor-rule
    path: cursor/rules/security-scanning.mdc
    activation: core
    shared: true
    effort_default: low
    triggers: ["code change", "dependency", "IaC", "container", "mcp config"]

  - id: semgrep-hooks
    domain: security
    runtime: cursor-hook
    path: cursor/hooks.json
    activation: core
    shared: true
    effort_default: low
    triggers: ["sessionStart", "afterFileEdit", "postToolUse", "stop"]

  - id: k3-cognitive-router
    domain: agentic
    runtime: cursor-skill
    path: cursor/user-skills/k3-cognitive-router
    activation: core
    shared: false
    effort_default: high
    triggers: ["complex task", "multi-agent", "long-horizon", "orchestrate"]
    aliases: ["k3-router", "cognitive-router"]

  - id: graphify
